<div class="toolModal-content">
  <div class="tabBox w-100">
    <div id="" class="frozenTabLinks flex-basis-auto text-lg font-weight-bolder" data-i18n="whatItemsToUploadModal_title"></div>
    <span class="close-modal bg-primary-dark px-2" id="close-modal">&times;</span>
  </div>
  <div class="toolModal-tabContent px-2 py-0 text-justify lh-120 text-dark" style="display: block;">
    <div class="text-sm text-center" data-i18n="whatItemsToUploadModal_howSaveWorks"></div>
    <p class="text-sm-md mt-1" data-i18n="whatItemsToUploadModal_whichAdsToSave"></p>
    <div class="form-check d-flex align-items-center">
      <input class="form-check-input" type="radio" name="items-to-upload" id="items-never-uploaded" checked>
      <label class="form-check-label" for="items-never-uploaded">
        <div class="d-flex mt-3 align-items-center text-sm-md text-dark" data-i18n="whatItemsToUploadModal_onlyNeverSaved"></div>
      </label>
    </div>
    <div class="form-check d-flex align-items-center">
      <input class="form-check-input" type="radio" name="items-to-upload" id="all-items">
      <label class="form-check-label" for="all-items">
        <div class="d-flex mt-3 align-items-center text-sm-md text-dark" data-i18n="whatItemsToUploadModal_allTargeted"></div>
      </label>
    </div>
    <div id="photos-if-duplicate-choice" class="collapse-clemz d-none">
      <hr class="border-grey border-sm mx-6 my-3">
      <div class="d-flex flex-column">
        <b class="h6" data-i18n="whatItemsToUploadModal_alreadySavedTitle"></b>
        <span class="text-sm mt-1" data-i18n="whatItemsToUploadModal_notSavedPhotosRemark"></span>
      </div>
      <div class="form-check d-flex align-items-center">
        <input class="form-check-input" type="radio" name="photos-if-duplicate" id="keep-clemz-photos" checked>
        <label class="form-check-label" for="keep-clemz-photos">
          <div class="d-flex mt-3 align-items-center text-sm-md text-dark" data-i18n="whatItemsToUploadModal_keepClemzPhotos"></div>
        </label>
      </div>
      <div class="form-check d-flex align-items-center">
        <input class="form-check-input" type="radio" name="photos-if-duplicate" id="upload-vinted-photos">
        <label class="form-check-label" for="upload-vinted-photos">
          <div class="mt-3 text-sm-md text-dark" data-i18n="whatItemsToUploadModal_replaceWithVintedPhotos"></div>
        </label>
      </div>
    </div>
    <div class="d-flex justify-content-end mt-2 mb-1">
      <div class="btn btn-sm btn-outline-success" id="confirmButton" role="button" data-i18n="whatItemsToUploadModal_okSave"></div>
    </div>
  </div>
</div>
