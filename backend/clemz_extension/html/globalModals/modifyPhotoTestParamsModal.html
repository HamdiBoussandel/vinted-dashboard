<div class="d-flex flex-column justify-content-center align-items-center">

  <div class="h4 font-weight-bolder">
    <span data-i18n="modifyPhotoTestParamsModal_originalPhoto">Photo originale</span>
    <span data-i18n="modifyPhotoTestParamsModal_example" id="example" class="d-none"> (exemple)</span>
  </div>
  <img src="" class="border" style="max-height: 35vh; max-width: 100%;" id="original-photo">

  <div class="h4 font-weight-bolder mt-3 text-primary" data-i18n="modifyPhotoTestParamsModal_modifiedPhoto"></div>
  <div style="position: relative; min-height: 10vh;" class="d-flex justify-content-center align-items-center w-100 border border-primary">
    <img id="modified-photo" src="" class="" style="max-height: 35vh; max-width: 100%; z-index: 202000;">
    <span class="spinner-border text-primary" role="status" style="max-height: 40px; max-width: 40px; position: absolute;">
      <span class="sr-only"></span>
    </span>
  </div>

  <p class="text-center d-none text-sm mt-0 text" id="preview-warning" data-i18n="modifyPhotoTestParamsModal_previewWarning"></p>
  <p class="" data-i18n="modifyPhotoTestParamsModal_exploreCatalog"></p>
  <ul class="mt-0 lh-100 list-unstyled w-100">
    <li class="mt-2 ml-0" data-i18n="modifyPhotoTestParamsModal_differentOptions"></li>
    <li class="mt-2 ml-0" data-i18n="modifyPhotoTestParamsModal_frameModels"></li>
    <li class="mt-2 ml-0" data-i18n="modifyPhotoTestParamsModal_differentFonts"></li>
  </ul>

  <div class="h-line w-100 mt-4 mb-2"></div>
  <div class="d-flex justify-content-center align-items-center w-100" id="alertButtonsDiv">
    <div class="btn btn-outline-danger" id="closePhotoTestModalButton" role="button" data-i18n="close"></div>
  </div>
</div>
