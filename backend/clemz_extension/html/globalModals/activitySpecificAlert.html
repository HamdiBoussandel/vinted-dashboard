<div style="position: absolute; left: 50%; top: 0; transform: translate(-50%, -50%);" class="badge badge-warning text-dark"
  data-i18n="activitySpecificAlert_infoBadge"></div>

<div class="d-flex flex-column justify-content-center align-items-center">
  <div class="" id="alert-content">
  </div>

  <div class="w-100 mt-2 mb-4" id="alert-can-be-muted">
    <input type="checkbox" id="stopShowingAlert" />
    <label for="stopShowingAlert" data-i18n="readStopMessage"></label>
  </div>

  <div class="d-flex justify-content-between align-items-center w-100" id="alertButtonsDiv">
    <div class="btn btn-dark" id="closeAlertButton" role="button" data-i18n="cancel"></div>
    <div class="btn btn-outline-success ml-5" id="continueAlertButton" role="button" data-i18n="continue"></div>
  </div>
